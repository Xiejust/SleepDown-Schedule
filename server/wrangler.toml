name = "sleepdown-class-sync"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# 先执行 `npx wrangler d1 create sleepdown-class-sync`，
# 再把返回的 database_id 填到这里。
[[d1_databases]]
binding = "DB"
database_name = "sleepdown-class-sync"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

[observability]
enabled = true